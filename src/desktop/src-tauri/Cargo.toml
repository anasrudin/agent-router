[package]
name = "agent-router-desktop"
version = "0.1.0"
description = "Desktop app for agent-router"
edition = "2021"

[lib]
name = "agent_router_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
tauri-plugin-notification = "2"
