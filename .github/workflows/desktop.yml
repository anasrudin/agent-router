name: desktop
# Builds the desktop installers on each OS's own runner (Tauri does not cross-compile reliably).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["src/**", "agent-harness-prompts/**", "package*.json", ".github/workflows/desktop.yml"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "src/desktop/src-tauri/target/release/bundle/msi/*.msi\nsrc/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          - os: ubuntu-22.04
            bundles: "src/desktop/src-tauri/target/release/bundle/deb/*.deb\nsrc/desktop/src-tauri/target/release/bundle/appimage/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: agent-router-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
