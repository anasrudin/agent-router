name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx bun run typecheck
      - run: npx bun run lint
      - run: npx bun test
      # No backend CLIs are installed on CI runners: doctor must still exit cleanly and report them missing.
      - run: npx bun run src/cli.ts doctor
        continue-on-error: true
